---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pre-wedding-service
  labels:
    app: pre-wedding-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pre-wedding-service
  template:
    metadata:
      labels:
        app: pre-wedding-service
    spec:
      containers:
      - name: pre-wedding-service
        image: 255289/pre-wedding-service:latest
        ports:
        - containerPort: 5002
          name: http
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: NODE_ENV
          value: "production"
        - name: ZAPSTER_TOKEN
          value: "your_zapster_token"
        - name: PORT
          value: "5002"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: pre-wedding-service
  labels:
    app: pre-wedding-service
spec:
  type: NodePort
  selector:
    app: pre-wedding-service
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 31001
